{% extends 'base.html' %}
{% block title %}{% if edit %}Edit GDB{% else %}Create GDB{% endif %}{% endblock %}
{% block content %}
<h2 class="mb-4 fw-bold">{% if edit %}Edit GDB{% else %}Create GDB{% endif %}</h2>

<div class="card mx-auto" style="max-width: 500px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">
                {% if edit %}Update{% else %}Create{% endif %}
            </button>
            <a href="{% url 'teacher_gdbs' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
