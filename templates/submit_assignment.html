{% extends 'base.html' %}
{% block title %}Submit Assignment{% endblock %}
{% block content %}
<div class="container">
    <h3>Submit Assignment: {{ assignment.assignment_name }}</h3>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}
